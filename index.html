<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GlobeSim — Earth rotation & lunar tide simulation</title>
<style>
  :root {
    --panel-bg: rgba(10, 14, 22, 0.82);
    --accent: #6db3ff;
    --text: #dbe4f0;
    --muted: #8fa0b5;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
  body { font: 13px/1.45 "Segoe UI", system-ui, sans-serif; color: var(--text); }
  canvas { display: block; }

  #panel {
    position: fixed; top: 12px; left: 12px; width: 288px;
    background: var(--panel-bg); border: 1px solid rgba(120,160,220,.25);
    border-radius: 10px; padding: 14px 16px; backdrop-filter: blur(6px);
    user-select: none;
  }
  #panel h1 { margin: 0 0 2px; font-size: 17px; letter-spacing: .5px; color: var(--accent); }
  #panel .sub { margin: 0 0 12px; font-size: 11px; color: var(--muted); }
  .row { margin: 10px 0; }
  .row label { display: block; font-size: 11px; color: var(--muted); margin-bottom: 3px;
    text-transform: uppercase; letter-spacing: .4px; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .val { font-variant-numeric: tabular-nums; color: var(--text); }
  .presets { display: flex; gap: 4px; margin-top: 4px; flex-wrap: wrap; }
  .presets button, #btn-pause, #btn-reset {
    background: #1b2a40; color: var(--text); border: 1px solid #33507a;
    border-radius: 6px; padding: 3px 8px; cursor: pointer; font-size: 11px;
  }
  .presets button:hover, #btn-pause:hover, #btn-reset:hover { background: #26395a; }
  #btn-pause { min-width: 70px; }
  .radios { display: flex; gap: 14px; }
  .radios label { display: flex; align-items: center; gap: 5px; font-size: 13px;
    color: var(--text); text-transform: none; margin: 0; }
  .radios input { accent-color: var(--accent); }
  .checks label { display: flex; align-items: center; gap: 6px; margin: 4px 0;
    text-transform: none; font-size: 12px; color: var(--text); }
  .checks input { accent-color: var(--accent); }
  #stats { margin-top: 12px; border-top: 1px solid rgba(120,160,220,.2); padding-top: 8px;
    font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
  #stats div { margin: 2px 0; }
  .buttons { display: flex; gap: 6px; }
  #hint { position: fixed; bottom: 10px; left: 12px; font-size: 11px; color: #6a7a90; }
  a { color: var(--accent); text-decoration: none; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js",
    "three/addons/": "./vendor/addons/"
  }
}
</script>
</head>
<body>
<div id="panel">
  <h1>GlobeSim</h1>
  <p class="sub">Earth rotation + lunar tidal bulge · three.js</p>

  <div class="row buttons">
    <button id="btn-pause">Pause</button>
    <button id="btn-reset">Reset camera</button>
  </div>

  <div class="row">
    <label>Sim speed: <span class="val" id="speed-val"></span></label>
    <input id="speed" type="range" min="0" max="6" step="0.05">
    <div class="presets">
      <button data-speed="1">x1</button>
      <button data-speed="60">x60</button>
      <button data-speed="3600">x3600</button>
      <button data-speed="21600">x21600</button>
      <button data-speed="100000">x100k</button>
    </div>
  </div>

  <div class="row">
    <label>Tide height (exaggerated): <span class="val" id="tide-val"></span></label>
    <input id="tide" type="range" min="0" max="1000" step="10" value="250">
  </div>

  <div class="row">
    <label>Tide computation</label>
    <div class="radios">
      <label><input type="radio" name="mode" value="gpu" checked> GPU (vertex shader)</label>
      <label><input type="radio" name="mode" value="cpu"> CPU (per-vertex)</label>
    </div>
  </div>

  <div class="row checks">
    <label><input id="chk-moon" type="checkbox" checked> Show Moon</label>
    <label><input id="chk-gravity" type="checkbox" checked> Moon gravity vector</label>
    <label><input id="chk-axis" type="checkbox"> Rotation axis / equator</label>
  </div>

  <div id="stats">
    <div id="stat-fps">—</div>
    <div id="stat-clock">t = 0 sim days</div>
    <div id="stat-cpu"></div>
    <div id="stat-period"></div>
  </div>
</div>
<div id="hint">Drag to orbit · scroll to zoom · space = pause · <a href="https://github.com/Lyky35/GlobeSim">github.com/Lyky35/GlobeSim</a></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
